<footer class="player" [class.visible]="audio.currentRadio()">

    <div class="player-info">
        <div class="player-favicon-wrap">
            <img *ngIf="audio.currentRadio()?.favicon" [src]="audio.currentRadio()?.favicon" class="player-favicon"
                alt="favicon" (error)="$any($event.target).style.display='none'" />
            <span class="player-favicon-fallback"
                [style.display]="audio.currentRadio()?.favicon ? 'none' : 'flex'">📻</span>
        </div>
        <div class="player-text">
            <span class="player-name">
                {{ audio.currentRadio()?.name || '—' }}
            </span>
            <span class="player-badge live" *ngIf="audio.isPlaying()">
                <span class="badge-icon badge-pulse">🔴</span> LIVE
            </span>
            <span class="player-badge error" *ngIf="audio.hasError()">
                <span class="badge-icon badge-fade">🚫</span> Unavailable
            </span>
            <span class="player-badge loading" *ngIf="audio.isLoading()">
                <span class="badge-icon badge-spin">⏳</span> Connecting...
            </span>
            <span class="player-badge mixed" *ngIf="audio.isMixedContent() && !audio.isPlaying()">
                <span class="badge-icon badge-shake">⚠️</span> HTTP
            </span>
        </div>
    </div>

    <div class="waveform" [style.opacity]="audio.isPlaying() ? '1' : '0'">
        <div class="wave-bar" style="animation-delay:0s"></div>
        <div class="wave-bar" style="animation-delay:0.1s"></div>
        <div class="wave-bar" style="animation-delay:0.2s"></div>
        <div class="wave-bar" style="animation-delay:0.15s"></div>
        <div class="wave-bar" style="animation-delay:0.05s"></div>
        <div class="wave-bar" style="animation-delay:0.25s"></div>
        <div class="wave-bar" style="animation-delay:0.3s"></div>
        <div class="wave-bar" style="animation-delay:0.08s"></div>
        <div class="wave-bar" style="animation-delay:0.18s"></div>
        <div class="wave-bar" style="animation-delay:0.12s"></div>
        <div class="wave-bar" style="animation-delay:0.22s"></div>
        <div class="wave-bar" style="animation-delay:0.07s"></div>
        <div class="wave-bar" style="animation-delay:0.28s"></div>
        <div class="wave-bar" style="animation-delay:0.35s"></div>
        <div class="wave-bar" style="animation-delay:0.03s"></div>
        <div class="wave-bar" style="animation-delay:0.17s"></div>
        <div class="wave-bar" style="animation-delay:0.13s"></div>
        <div class="wave-bar" style="animation-delay:0.23s"></div>
        <div class="wave-bar" style="animation-delay:0.09s"></div>
        <div class="wave-bar" style="animation-delay:0.19s"></div>
    </div>

    <div class="player-controls">
        <button class="player-btn" (click)="audio.isPlaying() ? audio.pause() : audio.resume()">
            {{ audio.isPlaying() ? '⏸' : '▶' }}
        </button>
        <div class="player-vol">
            <span class="vol-icon" (click)="audio.toggleMute()">{{ audio.isMuted() ? '🔈' : '🔊' }}</span>
            <div class="vol-wrap">
                <input class="vol-slider" type="range" min="0" max="1" step="0.05" [value]="audio.volume()"
                    [class.muted]="audio.isMuted()" (input)="onVolumeChange($event)" />
                <span class="vol-tooltip">{{ (audio.volume() * 100).toFixed(0) }}</span>
            </div>
        </div>
    </div>

</footer>
