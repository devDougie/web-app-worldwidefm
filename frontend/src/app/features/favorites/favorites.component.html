<div class="favorites-panel">
    @if (favorites.favorites().length === 0) {
    <div class="empty-fav">
        <p>Nenhuma rádio favoritada ainda.</p>
        <p class="empty-hint">Pressione ★ para adicionar</p>
    </div>
    } @else {
    <div class="stations-list">
        @for (radio of favorites.favorites(); track radio.stationuuid) {
        <div class="fav-item" [class.active]="audio.currentRadio()?.stationuuid === radio.stationuuid"
            (click)="playAndNavigate(radio)">
            <span class="fav-star">★</span>
            <div class="station-info">
                <div class="station-name">{{ radio.name }}</div>
                <div class="station-country">{{ radio.country }}</div>
            </div>
            <button class="fav-remove" (click)="$event.stopPropagation(); favorites.toggle(radio)"
                title="Remover">✕</button>
        </div>
        }
        <div class="fav-count">{{ favorites.count() }} saved stations</div>
    </div>
    }
</div>
