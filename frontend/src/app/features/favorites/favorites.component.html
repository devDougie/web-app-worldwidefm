<div class="favorites-panel">
    <h3 class="section-title">Favoritos <span class="count">{{ favorites.count() }}</span></h3>

    @if (favorites.favorites().length === 0) {
    <p class="empty">Nenhuma rádio favoritada ainda.</p>
    } @else {
    <ul class="fav-list">
        @for (radio of favorites.favorites(); track radio.stationuuid) {
        <li class="fav-item" [class.active]="audio.currentRadio()?.stationuuid === radio.stationuuid">
            <button class="fav-play" (click)="playAndNavigate(radio)">
                <span class="fav-name">{{ radio.name }}</span>
                <span class="fav-country">{{ radio.country }}</span>
            </button>
            <button class="fav-remove" (click)="favorites.toggle(radio)" title="Remover">✕</button>
        </li>
        }
    </ul>
    }
</div>
