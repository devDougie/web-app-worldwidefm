services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: worldwidefm-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - worldwidefm-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: worldwidefm-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - worldwidefm-net

networks:
  worldwidefm-net:
    driver: bridge